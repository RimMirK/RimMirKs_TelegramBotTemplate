__title__: 🏴 Русский

coming_soon: В разработке, Скоро будет!

start_lang:
    lang_set_to: Язык установлен на Русский!
    start_text: |
        Привет!

        Выберите язык:

    get_started: Начнем!
    choose_lang: Выбери язык

    error_start_text: Упс! Похоже Ваша ссылка повредилась


rules:
    rules_file: rules.ru.md

    rules_not_confirmed: |
        {% if html %}<b>{% endif %} Вы не приняли правила!{% if html %}</b>{% endif %}
        Пожалуйста, ознакомьтесь с правилами и примите их, использовав команду /rules.

    confirm_rules_text: |
        Перед началом работы с ботом, пожалуйста, ознакомьтесь с нашими правилами и подтвердите их принятие.

        <b>Правила: {{ rules_url }}</b>

        <b><i>ВНИМАНИЕ! Ссылка на правила может меняться!</i></b>

    confirm_rules_btn: Принять правила ✅
    rules_confirmed_text: |
        Спасибо за принятие правил! Теперь вы можете использовать бота

        В случае чего, вы можете повторно ознакомиться с правилами, используя команду /rules.
        
    rules_text: |
        Вот правила: {{ rules_url }}

        <b><i>ВНИМАНИЕ! Ссылка на правила может меняться!</i></b>

menu:
    menu_text: |
        👋 Привет! Я бот для ...

settings:
    text: <b>Настройки</b>
    copy_my_id_btn: 🆔 Скопировать свой ID
    change_lang: 🌐 Change language | Изменить язык
    change_timezone: ⏰ Изменить часовой пояс | {{ timezone }}

    tz:
        choose_region: Выбери свой регион
        choose_timezone: Выбери свой часовой пояс
        back_to_regions: Назад, к регионам
        back_to_settings: Назад, к настройкам
        timezone_set: Часовой пояс <b>{{ timezone }}</b> установлен!

    choose_lang: Выберите язык

you_are_banned_inline: Ты забанен!
you_are_not_admin: Ты не админ!

cmd_desc:
    start: ❇️ (Пере-)запустить бота
    menu: 📊 Главное меню
    lang: 🌐 Change language | Изменить язык
    settings: ⚙️ Настройки
    rules: 📕 Правила
    about: ℹ️ О боте
    help: 🆘 Помощь
    credits: 🗂 Авторы

    ban: "🛑 <ID/Ответ> забанить юзера"
    unban: "❎ <ID/Ответ> разбанить юзера"
    get_error: "📛 <ID> Получить ошибку"
    py: "🐍 [код] Запустить код Python"
    newsletter: "📢 [-i режим важности] Рассылка"
    edit_newsletter: "📢📝 <ID> Редактировать рассылку"
    delete_newsletter: "📢❌ <ID> Удалить рассылку"



about: | # Пожалуйста, не удаляйте информацию о шаблоне
    <b>О боте</b>

    Описание бота...

    <blockquote>Этот бот создан на основе <a href="https://github.com/RimMirK/RimMirKs_TelegramBotTemplate"
    >RimMirK's Telegram Bot Template</a> — продвинутого шаблона для создания Telegram ботов на Python.</blockquote>

    Исходный код бота: <a href="https://github.com/RimMirK/RimMirKs_TelegramBotTemplate">GitHub</a>


credits: | # Пожалуйста, не удаляйте разработчика шаблона
    <b>Авторы и благодарности</b>

    Разработчики:
        Главный разработчик: @your_username
        Помощники: @helper1, @helper2
        Разработчик шаблона: @RimMirK

    Благодарности:
        @somebody — за помощь с ...
        @another — за идеи и вдохновение
        @artist — за иконки и дизайн

    




errors:
    error_occurred: >
        😢 Упс! Произошла ошибка! Пожалуйста, сообщите об этом администрации,
        указав ID ошибки: {% if html %}<code>{% endif %}{{ escape(id) }}{% if html %}</code>{% endif %}

    enter_value: Введи значение!
    input_value: Введи значение!
    error_not_found: Ошибка <code>{{ eid }}</code> не найдена!
    error_msg_fmt: |
        <b>ERROR INFO</b>

        <b>ID</b>: <code>{{ eid }}</code>
        <b>USER</b>: <code>{{ user_id }}</code>
        <b>TIME</b>: <b>{{ time_str }}</b> [{{ time }}]
        <b>URL</b>: {{ paste(traceback, "py", True) }}
        <b>TRACEBACK</b>:
        <pre language="python">{% if traceback|length > 2000 %}
        {{ traceback[:1000] ~ "\n\n...\n\n" ~ traceback[-1000:] }}
        {% else %}
        {{ traceback }}
        {% endif %}
        </pre>

ban:
    enter_value: Введи значение!
    input_value: Введи значение!
    user_banned: Юзер <code>{{ user_id }}</code> забанен навсегда!
    user_unbanned: Юзер <code>{{ user_id }}</code> Разбанен!

back:
    back_btn: <− Назад
    back_to_menu_btn: <− Назад в меню

newsletter:
    important_mode_enabled: >
        ‼ Режим важности включен: Рассылка отправиться всем, даже если она отключена

    write_msg: Напиши сообщение

    switch_important_mode:  В{{ '' if on else 'ы' }}ключить режим важности

    send_one_media: Отлично! Теперь отправь <u>одну</u> картинку, видео или гифку

    skip: Пропустить

    add_links: |
        добавьте ссылку(и)

        Формат:
        <pre>текст первой кнопки первого ряда
        ссылка кнопки
        
        1 ряд 2 кнопка
        ссылка
        
        
        2 ряд 1 кнопка
        ссылка
        
        ...</pre>
    
    everything_ok: Все так, как ты хотел?

    started: Рассылка запущена

    end: |
        Рассылка завершена! ID рассылки: <code>{{ nid }}</code>
        отправлено {{ c }} {{ plural_ru(c, ["юзеру", "юзерам", "юзерам"]) }}
        успешно дошло до {{ s }} {{ plural_ru(s, ["юзера", "юзеров", "юзеров"]) }}
        
        {{ _('newsletter.errors_block', errors=errors)|safe }}
    
    errors_block: |
        Ошибок: {{ errors|length }}
        {% set err_list = _('newsletter.errors_list', errors=errors, format='html') %}
        {% if (err_list|length) < 3500 %}
        {{ err_list|safe }}
        {% else %}
        {% set err_list = _('newsletter.errors_list', errors=errors, format='md') %}
        {{ paste(err_list, 'md') }}
        {% endif %}

    errors_list: |
        {{ "<blockquote expandable>"|safe if format|default("html") == "html" else "" }}{% for user, ex in errors %}
        {{ "<code>"|safe if format|default("html") == "html" else ("`" if format|default("html") == 'md' else '')}}{{ user }}{{ '</code>'|safe if format|default('html') == 'html' else ('`' if format|default('html') == 'md' else '') }}: {{ ex.description if hasattr(ex, 'description') or ex }}
        {% endfor %}
        {{ "</blockquote>"|safe if format|default("html") == "html" else "" }}



    cancelled: Рассылка отменена!


    translating: Перевожу текст...
    translations_menu: Меню авто-переводов


    delete:
        invalid_id: Введен неверный ID!
        not_found: Рассылка с ID <code>{{ nid }}</code> не найдена!
        deleted: |
            Рассылка с ID <code>{{ nid }}</code> удалена!
            Удалено сообщений: {{ d }}/{{ c }}

            {{ _('newsletter.errors_block', errors=errors)|safe }}